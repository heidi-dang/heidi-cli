name: Remove Direct Coding sandbox once

on:
  push:
    branches: [remove-direct-coding-sandbox]
    paths:
      - .github/workflows/remove-direct-coding-sandbox-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-direct-coding-sandbox
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove Direct Coding sandbox implementation and configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              file = root / path
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          tools = "apps/cptr/cptr/utils/tools.py"
          replace_once(
              tools,
              "from cptr.services.command_sandbox import SandboxUnavailable, sandbox_command\n",
              "",
          )
          replace_once(
              tools,
              '''    if __context__.get("direct_coding"):\n        try:\n            sandboxed = sandbox_command(\n                command=command,\n                argv=__argv,\n                workspace=workspace,\n                work_dir=work_dir,\n                allow_network=bool(__context__.get("allow_network")),\n                profile=__context__.get("sandbox_profile"),\n            )\n        except SandboxUnavailable as e:\n            return f"Error: direct coding sandbox unavailable: {e}"\n        __argv = sandboxed.argv\n        if sandboxed.shell_command is not None:\n            command = sandboxed.shell_command\n        __use_pty = False\n\n''',
              "",
          )

          install_core = root / "scripts/install-core.sh"
          text = install_core.read_text(encoding="utf-8")
          for old in (
              'SANDBOX_PROFILE="${HEIDI_SANDBOX_PROFILE:-bubblewrap}"\n',
              '    env_line CPTR_DIRECT_CODING_SANDBOX "$SANDBOX_PROFILE"\n',
              '  env_line HEIDI_SANDBOX_PROFILE "$SANDBOX_PROFILE"\n',
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"scripts/install-core.sh: expected one {old.strip()!r}, found {count}")
              text = text.replace(old, "", 1)
          install_core.write_text(text, encoding="utf-8")

          install_lib = root / "scripts/install-lib.sh"
          text = install_lib.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''ensure_host_security_dependencies\(\) \{\n'''
              r'''  local packages=\(bubblewrap age\)\n'''
              r'''  need_cmd setcap \|\| packages\+=\(libcap2-bin\)\n'''
              r'''  if ! need_cmd bwrap \|\| ! need_cmd age \|\| ! need_cmd age-keygen \|\| ! need_cmd setcap; then\n'''
              r'''    step "Installing sandbox, encryption, and capability dependencies"\n'''
              r'''    apt_install "\$\{packages\[@\]\}" \|\| fail "bubblewrap, age, and libcap are required for the managed production profile"\n'''
              r'''  fi\n'''
              r'''\}\n'''
          )
          replacement = '''ensure_host_security_dependencies() {\n  local packages=(age)\n  need_cmd setcap || packages+=(libcap2-bin)\n  if ! need_cmd age || ! need_cmd age-keygen || ! need_cmd setcap; then\n    step "Installing encryption and capability dependencies"\n    apt_install "${packages[@]}" || fail "age and libcap are required for the managed production profile"\n  fi\n}\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("scripts/install-lib.sh: host security dependency block did not match")
          install_lib.write_text(text, encoding="utf-8")

          verify = root / "scripts/verify-stack.sh"
          text = verify.read_text(encoding="utf-8")
          text, count = re.subn(
              r'''\ncheck_sandbox\(\) \{.*?\n\}\n\ncheck_tailscale\n''',
              "\ncheck_tailscale\n",
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("scripts/verify-stack.sh: check_sandbox block did not match")
          text = text.replace(
              '  split-tailscale:backend) check_backend; check_sandbox ;;',
              '  split-tailscale:backend) check_backend ;;',
          )
          text = text.replace(
              '  *) check_backend; check_sandbox; check_mcp ;;',
              '  *) check_backend; check_mcp ;;',
          )
          verify.write_text(text, encoding="utf-8")

          compatibility_path = root / "release/compatibility.json"
          compatibility = json.loads(compatibility_path.read_text(encoding="utf-8"))
          if "sandbox" not in compatibility:
              raise SystemExit("release/compatibility.json: sandbox section already absent unexpectedly")
          del compatibility["sandbox"]
          migration = (
              "Direct Coding executes natively on the authorized CPTR host under the selected control profile; "
              "the Bubblewrap/systemd/container/VM sandbox execution profiles and their configuration surface were removed."
          )
          migrations = compatibility.setdefault("migrations", [])
          if migration not in migrations:
              migrations.append(migration)
          compatibility_path.write_text(
              json.dumps(compatibility, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          for relative in (
              "apps/cptr/cptr/services/command_sandbox.py",
              "apps/cptr/tests/test_command_sandbox.py",
          ):
              path = root / relative
              if not path.exists():
                  raise SystemExit(f"expected sandbox file is missing before migration: {relative}")
              path.unlink()

          active = (
              root / "apps/cptr/cptr/utils/tools.py",
              root / "scripts/install-core.sh",
              root / "scripts/install-lib.sh",
              root / "scripts/verify-stack.sh",
              root / "release/compatibility.json",
          )
          forbidden = (
              "cptr.services.command_sandbox",
              "CPTR_DIRECT_CODING_SANDBOX",
              "HEIDI_SANDBOX_PROFILE",
              "CPTR_DIRECT_CODING_CONTAINER_IMAGE",
              "CPTR_DIRECT_CODING_VM_RUNNER",
              '"bubblewrap"',
              "bwrap",
              "sandbox_profile",
          )
          offenders = []
          for path in active:
              body = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in body:
                      offenders.append(f"{path.relative_to(root)}: {marker}")
          if offenders:
              raise SystemExit("sandbox surface remains:\n" + "\n".join(offenders))

          installer = (root / "scripts/install-core.sh").read_text(encoding="utf-8")
          if "state_default HEIDI_CONTROL_PROFILE owner-full" not in installer:
              raise SystemExit("owner-full default was accidentally changed")
          PY

          python3 -m py_compile apps/cptr/cptr/utils/tools.py
          python3 -m json.tool release/compatibility.json >/dev/null
          bash -n scripts/install-core.sh scripts/install-lib.sh scripts/verify-stack.sh

          git rm .github/workflows/remove-direct-coding-sandbox-once.yml
          git add -A
          git diff --cached --check
          git config user.name "heidi-maintenance-bot"
          git config user.email "heidi-maintenance-bot@users.noreply.github.com"
          git commit -m "refactor(cptr): remove Direct Coding sandbox layer"
          git push origin HEAD:remove-direct-coding-sandbox
