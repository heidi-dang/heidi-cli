name: Heidi v2.1 Surgical Patch

on:
  push:
    branches: [feat/heidi-v2.1-owner-full]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/heidi-v2.1-owner-full
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact contract edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          mcp = pathlib.Path('apps/mcp/server/mcp.ts')
          text = mcp.read_text(encoding='utf-8')
          old_import = '''import {
            MCP_CONTRACT_TOOL_COUNT,
            MCP_CONTRACT_VERSION,
            currentPluginUpdateManifest,
          } from "./release.js";
          export { MCP_CONTRACT_TOOL_COUNT, MCP_CONTRACT_VERSION } from "./release.js";'''
          new_import = '''import {
            MCP_COMPACT_TOOL_NAMES,
            MCP_CONTRACT_TOOL_COUNT,
            MCP_CONTRACT_VERSION,
            currentPluginUpdateManifest,
          } from "./release.js";
          export { MCP_COMPACT_TOOL_NAMES, MCP_CONTRACT_TOOL_COUNT, MCP_CONTRACT_VERSION } from "./release.js";'''
          if old_import not in text:
              raise SystemExit('expected mcp release import block not found')
          text = text.replace(old_import, new_import, 1)
          pattern = re.compile(r'const COMPACT_PUBLIC_TOOLS = new Set\(\[\n.*?\n\]\);', re.S)
          text, count = pattern.subn('const COMPACT_PUBLIC_TOOLS = new Set<string>(MCP_COMPACT_TOOL_NAMES);', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one compact allowlist, replaced {count}')
          mcp.write_text(text, encoding='utf-8')

          lock_path = pathlib.Path('apps/mcp/package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = '2.1.0'
          lock['packages']['']['version'] = '2.1.0'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit surgical patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mcp/server/mcp.ts apps/mcp/package-lock.json
          git commit -m 'feat: wire canonical v2.1 compact contract'
          git push origin HEAD:feat/heidi-v2.1-owner-full
