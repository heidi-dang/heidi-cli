name: Heidi CLI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PR95 MCP v2 migration in CI workspace
        run: python3 scripts/pr95-mcp-v2-migrate.py
      - name: Regenerate MCP lockfile
        run: npm --prefix apps/mcp install --package-lock-only --ignore-scripts
      - name: Install migrated MCP dependencies
        run: npm --prefix apps/mcp ci
      - name: Build migrated MCP
        run: npm --prefix apps/mcp run build
      - name: Test migrated MCP
        run: npm --prefix apps/mcp test
      - name: Typecheck migrated MCP
        run: npm --prefix apps/mcp run typecheck
      - name: Test universal OAuth migration contract
        run: python3 -m unittest tests.test_cloudflare_provision tests.test_mcp_v2_oauth_contract
      - name: Assert v1 SDK imports are gone
        run: test -z "$(grep -R '@modelcontextprotocol/sdk' apps/mcp/server apps/mcp/tests --include='*.ts' || true)"
      - uses: actions/upload-artifact@v4
        with:
          name: pr95-mcp-v2-migrated-tree
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/mcp/package.json
            apps/mcp/package-lock.json
            apps/mcp/server
            apps/mcp/tests
            apps/mcp/.env.example
            apps/mcp/README.md
            scripts/cloudflare-provision.py

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install installer-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Shell syntax
        run: bash -n install.sh scripts/install-core.sh scripts/install-lib.sh scripts/install-split-backend.sh scripts/install-split-mcp.sh scripts/verify-stack.sh bin/heidi
      - name: Python syntax
        run: python3 -m py_compile scripts/bootstrap-control-token.py scripts/control_token_profiles.py scripts/verify-compatibility.py scripts/cloudflare-provision.py scripts/lifecycle.py scripts/release-manifest.py scripts/remediation.py scripts/split-handoff.py
      - name: Installer, lifecycle, release, profile, and Cloudflare contracts
        run: python3 -m pytest -q tests
      - name: Cross-component compatibility contract
        run: python3 scripts/verify-compatibility.py
      - name: Executable contracts
        run: |
          for file in install.sh bin/heidi scripts/install-core.sh scripts/install-lib.sh scripts/install-split-backend.sh scripts/install-split-mcp.sh scripts/verify-stack.sh scripts/bootstrap-control-token.py scripts/cloudflare-provision.py scripts/lifecycle.py scripts/release-manifest.py scripts/remediation.py scripts/split-handoff.py; do
            test -x "$file"
          done
      - name: Repository hygiene
        run: |
          test -z "$(git ls-files | grep -E '(^|/)\.env$|(^|/)node_modules/|(^|/)target/|(^|/)\.cptr/|(^|/)\.fdx/|release-signing-private|\.gcp-iap-plugin-proxy' || true)"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - run: npm --prefix apps/mcp ci
      - run: npm --prefix apps/mcp run build
      - run: npm --prefix apps/mcp test
      - run: npm --prefix apps/mcp run typecheck

  cptr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow Chrome sandbox user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cptr/cptr/frontend/package-lock.json
      - name: Build CPTR frontend
        run: |
          npm --prefix apps/cptr/cptr/frontend ci
          npm --prefix apps/cptr/cptr/frontend run build
      - name: Install CPTR
        run: python -m pip install -e './apps/cptr[all]'
      - name: Install CPTR test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.14.8
      - name: Test CPTR
        run: python -m pytest apps/cptr/tests
      - name: Ruff
        run: ruff check apps/cptr/cptr apps/cptr/tests

  fdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p fdx
