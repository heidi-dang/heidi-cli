name: PR95 final integration

on:
  push:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[finalize-pr95]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate SDK v2 and no-hardcode OAuth worker
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pr95-worker-oauth-config
          git checkout origin/pr95-worker-oauth-config -- \
            apps/mcp/.env.example \
            scripts/cloudflare-provision.py \
            tests/test_cloudflare_provision.py \
            tests/test_mcp_v2_oauth_contract.py

          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path.cwd()
          mcp = root / "apps" / "mcp"

          package_path = mcp / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          deps = package["dependencies"]
          deps.pop("@modelcontextprotocol/sdk", None)
          deps["@modelcontextprotocol/server"] = "^2.0.0"
          deps["@modelcontextprotocol/node"] = "^2.0.0"
          deps["zod"] = "^4.2.0"
          package["devDependencies"]["@modelcontextprotocol/client"] = "^2.0.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          replacements = {
              "@modelcontextprotocol/sdk/server/mcp.js": "@modelcontextprotocol/server",
              "@modelcontextprotocol/sdk/client/index.js": "@modelcontextprotocol/client",
              "@modelcontextprotocol/sdk/inMemory.js": "@modelcontextprotocol/server",
              "@modelcontextprotocol/sdk/server/streamableHttp.js": "@modelcontextprotocol/node",
              "@modelcontextprotocol/sdk/types.js": "@modelcontextprotocol/server",
          }
          for path in mcp.rglob("*.ts"):
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          mcp_path = mcp / "server" / "mcp.ts"
          text = mcp_path.read_text(encoding="utf-8")
          marker = '"cptr_render_live_terminal"'
          start = text.find(marker)
          output = text.find("      outputSchema:", start)
          if start < 0 or output < 0:
              raise SystemExit("cptr_render_live_terminal schema boundary is missing")
          window = text[start:output]
          if "inputSchema: z.object({" in window:
              window = window.replace("inputSchema: z.object({", "inputSchema: {", 1)
              close = window.rfind("      }),")
              if close < 0:
                  raise SystemExit("cptr_render_live_terminal input schema close is not recognized")
              window = window[:close] + "      }," + window[close + len("      }),"):]
              text = text[:start] + window + text[output:]
              mcp_path.write_text(text, encoding="utf-8")
          elif "inputSchema: {" not in window:
              raise SystemExit("cptr_render_live_terminal input schema shape is not recognized")

          readme_path = mcp / "README.md"
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "`MCP_ALLOWED_ORIGINS` is a comma-separated explicit browser-origin allowlist (for example `https://chatgpt.com`);",
              "`MCP_ALLOWED_ORIGINS` is a comma-separated explicit browser-origin allowlist supplied by the operator; no client origin is built in;",
          )
          readme = readme.replace(
              "The Cloudflare provisioner enables first-party redirect families for ChatGPT, Claude, Grok, and Gemini and accepts repeatable `--oauth-redirect-uri` values for additional clients.",
              "The Cloudflare provisioner ships no client redirect defaults. Supply trusted redirect URIs through `MCP_OAUTH_REDIRECT_URIS` or repeatable `--oauth-redirect-uri` values.",
          )
          readme_path.write_text(readme, encoding="utf-8")

          ci_path = root / ".github" / "workflows" / "ci.yml"
          ci = ci_path.read_text(encoding="utf-8")
          start = ci.find("  migration:\n")
          end = ci.find("\n  installer:\n", start) if start >= 0 else -1
          if start >= 0:
              if end < 0:
                  raise SystemExit("temporary migration CI block is malformed")
              ci = ci[:start] + ci[end:]
              ci_path.write_text(ci, encoding="utf-8")
          PY

          npm --prefix apps/mcp install --package-lock-only --ignore-scripts
          rm -f scripts/pr95-mcp-v2-migrate.py
          rm -f .github/workflows/pr95-mcp-v2-migrate.yml

          if grep -R -E 'mcp\.tnaprovider\.com\.au|chatgpt\.com|claude\.ai|grok\.com|gemini\.google\.com' \
            apps/mcp/.env.example scripts/cloudflare-provision.py apps/mcp/server/index.ts; then
            echo 'environment-specific MCP/OAuth hostname remains in production config' >&2
            exit 1
          fi
          if grep -R '@modelcontextprotocol/sdk' apps/mcp/server apps/mcp/tests --include='*.ts'; then
            echo 'legacy MCP SDK import remains' >&2
            exit 1
          fi

          git add -A
          git diff --cached --check
          git diff --cached --binary --full-index > /tmp/pr95-final.patch
          test -s /tmp/pr95-final.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr95-final-patch
          path: /tmp/pr95-final.patch
          if-no-files-found: error
          retention-days: 1

  verify-mcp:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pr95-final-patch
      - run: git apply --index pr95-final.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - name: MCP build, tests, typecheck, and audit
        run: |
          npm --prefix apps/mcp ci
          npm --prefix apps/mcp run build
          npm --prefix apps/mcp test
          npm --prefix apps/mcp run typecheck
          npm --prefix apps/mcp audit --audit-level=high
      - name: OAuth and v2 contracts
        run: python3 -m pytest -q tests/test_mcp_v2_oauth_contract.py tests/test_cloudflare_provision.py

  verify-installer:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pr95-final-patch
      - run: git apply --index pr95-final.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer and compatibility contracts
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          bash -n install.sh scripts/install-core.sh scripts/install-lib.sh scripts/install-split-backend.sh scripts/install-split-mcp.sh scripts/verify-stack.sh bin/heidi
          python3 -m py_compile scripts/bootstrap-control-token.py scripts/control_token_profiles.py scripts/verify-compatibility.py scripts/cloudflare-provision.py scripts/lifecycle.py scripts/release-manifest.py scripts/remediation.py scripts/split-handoff.py
          python3 -m pytest -q tests
          python3 scripts/verify-compatibility.py
          git diff --cached --check

  verify-cptr:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pr95-final-patch
      - run: git apply --index pr95-final.patch
      - name: Allow Chrome sandbox user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cptr/cptr/frontend/package-lock.json
      - name: CPTR build, tests, and lint
        run: |
          npm --prefix apps/cptr/cptr/frontend ci
          npm --prefix apps/cptr/cptr/frontend run build
          python -m pip install -e './apps/cptr[all]'
          python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.14.8
          python -m pytest apps/cptr/tests
          ruff check apps/cptr/cptr apps/cptr/tests

  verify-fdx:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pr95-final-patch
      - run: git apply --index pr95-final.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: FDX formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test -p fdx

  integrate:
    needs: [verify-mcp, verify-installer, verify-cptr, verify-fdx]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pr95-final-patch
      - name: Commit the verified integration
        shell: bash
        run: |
          set -euo pipefail
          git apply --index pr95-final.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mcp): finalize SDK v2 and universal OAuth integration'
          git push origin HEAD:${GITHUB_REF_NAME}
