name: PR95 MCP v2 lockfile finalizer

on:
  push:
    branches:
      - feat/heidi-v2.1-owner-full

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[run-mcp-v2-migration]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/heidi-v2.1-owner-full
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete MCP SDK v2 source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              '@modelcontextprotocol/sdk/server/mcp.js': '@modelcontextprotocol/server',
              '@modelcontextprotocol/sdk/client/index.js': '@modelcontextprotocol/client',
              '@modelcontextprotocol/sdk/inMemory.js': '@modelcontextprotocol/server',
              '@modelcontextprotocol/sdk/server/streamableHttp.js': '@modelcontextprotocol/node',
              '@modelcontextprotocol/sdk/types.js': '@modelcontextprotocol/server',
          }
          root = Path('apps/mcp')
          for path in root.rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          mcp_path = root / 'server' / 'mcp.ts'
          text = mcp_path.read_text(encoding='utf-8')
          marker = '"cptr_render_live_terminal"'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('cptr_render_live_terminal registration is missing')
          window_end = text.find('annotations:', start)
          if window_end < 0:
              raise SystemExit('cptr_render_live_terminal schema boundary is missing')
          window = text[start:window_end]
          if 'outputSchema: z.object({' not in window:
              pattern = re.compile(r'outputSchema:\s*\{(?P<body>\s*target_type:\s*z\.enum\(\["task",\s*"monitor",\s*"command"\]\),.*?recent_events:\s*z\.array\(z\.record\(z\.string\(\),\s*z\.unknown\(\)\)\),\s*)\},', re.S)
              migrated, count = pattern.subn(lambda m: 'outputSchema: z.object({' + m.group('body') + '}),', window, count=1)
              if count != 1:
                  raise SystemExit('cptr_render_live_terminal output schema shape is not recognized')
              text = text[:start] + migrated + text[window_end:]
              mcp_path.write_text(text, encoding='utf-8')
          PY
      - name: Verify migrated dependency manifest
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./apps/mcp/package.json');
          if (pkg.dependencies['@modelcontextprotocol/sdk']) throw new Error('v1 MCP SDK dependency remains');
          for (const name of ['@modelcontextprotocol/server', '@modelcontextprotocol/node']) {
            if (!pkg.dependencies[name]?.startsWith('^2.')) throw new Error(`${name} is not on v2`);
          }
          if (!pkg.devDependencies['@modelcontextprotocol/client']?.startsWith('^2.')) throw new Error('@modelcontextprotocol/client is not on v2');
          if (!pkg.dependencies.zod?.startsWith('^4.')) throw new Error('zod is not on v4');
          NODE
          test -z "$(grep -R '@modelcontextprotocol/sdk' apps/mcp/server apps/mcp/tests --include='*.ts' || true)"
      - name: Regenerate MCP lockfile
        run: npm --prefix apps/mcp install --package-lock-only --ignore-scripts
      - name: Install and verify migrated MCP
        shell: bash
        run: |
          npm --prefix apps/mcp ci
          npm --prefix apps/mcp run build
          npm --prefix apps/mcp test
          npm --prefix apps/mcp run typecheck
          python3 -m pytest -q tests/test_mcp_v2_oauth_contract.py tests/test_cloudflare_provision.py
      - name: Commit finalized migration
        shell: bash
        run: |
          if git diff --quiet -- apps/mcp/package-lock.json apps/mcp/server apps/mcp/tests; then
            echo 'MCP v2 migration is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mcp/package-lock.json apps/mcp/server apps/mcp/tests
          git commit -m 'build(mcp): finalize SDK v2 migration'
          git push origin HEAD:feat/heidi-v2.1-owner-full
